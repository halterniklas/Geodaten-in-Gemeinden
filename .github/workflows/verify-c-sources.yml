name: C-Grundlagenkataster prüfen

# Prüft alle Links des C-Grundlagenkatasters, führt die automatische Recherche
# aus, erzeugt C_Grundlagenkataster_verifiziert.xlsx und die Berichte unter
# reports/ und stellt sie als Artifact bereit. GitHub-hosted Runner haben freien
# Internetzugang (die lokale Entwicklungsumgebung nicht).
on:
  workflow_dispatch:
    inputs:
      discovery:
        description: "Automatische Recherche (Einstiegsseiten, Sitemaps, optional Such-API) ausführen"
        type: boolean
        default: true
      commit_results:
        description: "Ergebnisse in den Branch zurückschreiben"
        type: boolean
        default: true
  push:
    branches: ["claude/**"]
    paths:
      - scripts/verify_c_sources.py
      - data/**
      - requirements.txt
      - .github/workflows/verify-c-sources.yml

permissions:
  contents: write

concurrency:
  group: verify-c-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Links prüfen, recherchieren, Excel und Berichte erzeugen
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          mkdir -p reports
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.discovery }}" = "false" ]; then ARGS="--no-discovery"; fi
          python3 scripts/verify_c_sources.py $ARGS 2>&1 | tee reports/lauf.log; test ${PIPESTATUS[0]} -eq 0
      - name: Zusammenfassung
        run: |
          {
            echo "## C-Grundlagenkataster"
            sed -n '/## 1 Kennzahlen/,/## 2 /p' reports/recherchebericht.md | head -n -1
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: c-grundlagenkataster-${{ github.run_number }}
          path: |
            C_Grundlagenkataster_verifiziert.xlsx
            reports/
          retention-days: 90
      - name: Ergebnisse committen
        if: github.event_name == 'push' || inputs.commit_results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add C_Grundlagenkataster_verifiziert.xlsx reports/
          git diff --cached --quiet || git commit -m "C-Grundlagenkataster: Linkprüfung und Recherche (Lauf ${{ github.run_number }})"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
