name: C1 Pipeline-Test (frische Maschine)

# Testet das R-Projekt c1-finanzen von Grund auf: R + Pakete + Quarto installieren,
# Rohdaten-Download-Skript gegen die echten Quellen laufen lassen, Pipeline und Bericht ausführen.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: c1-finanzen
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: c1-finanzen
          cache-version: 1
          extra-packages: |
            any::dplyr
            any::tidyr
            any::readr
            any::readxl
            any::stringr
            any::purrr
            any::tibble
            any::ggplot2
            any::scales
            any::sf
            any::pdftools
            any::jsonlite
            any::httr
            any::ranger
            any::mgcv
            any::xgboost
            any::sandwich
            any::lmtest
            any::spdep
            any::knitr
            any::rmarkdown
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Rohdaten löschen und neu herunterladen (Test des R-Download-Skripts)
        run: |
          mkdir -p /tmp/raw_committed && cp -r data/raw/download/. /tmp/raw_committed/
          rm -rf data/raw/download
          Rscript R/01_download.R
          echo "--- Vergleich mit den committeten Rohdaten (Grösse in Bytes) ---"
          for f in /tmp/raw_committed/*; do b=$(basename "$f"); if [ -f "data/raw/download/$b" ]; then a=$(stat -c %s "$f"); c=$(stat -c %s "data/raw/download/$b"); [ "$a" = "$c" ] && echo "gleich   $b" || echo "ABWEICHT $b ($a vs $c)"; else echo "FEHLT    $b"; fi; done
      - name: Pipeline und Bericht
        run: Rscript R/run_all.R
      - uses: actions/upload-artifact@v4
        with:
          name: c1-finanzen-ergebnisse
          path: |
            c1-finanzen/output
            c1-finanzen/report/bericht.html
            c1-finanzen/data/raw/quellenprotokoll.csv
