name: C1 Datenquellen sondieren

on:
  workflow_dispatch:
  push:
    branches: [c1-data-fetch]
    paths:
      - c1-finanzen/tools/probe.py
      - .github/workflows/c1-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quellen sondieren
        run: python3 c1-finanzen/tools/probe.py c1-finanzen/data/raw/_probe
      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c1-finanzen/data/raw/_probe
          git diff --cached --quiet || git commit -m "C1: Quellensondierung"
          git push origin HEAD:${GITHUB_REF_NAME}
